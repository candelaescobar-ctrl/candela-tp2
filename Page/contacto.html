        <section class="contacto-formulario">
    <h2>Envíanos tu mensaje</h2>
    <form action="confirmacion.html" method="get">
        <div class="campo">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
        </div>

        <div class="campo">
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>
        </div>

        <div class="campo">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="campo">
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribí tu comentario sobre Intensa-Mente 2..." required></textarea>
        </div>

        <button type="submit" class="boton-enviar">Enviar mensaje</button>
    </form>
</section>
